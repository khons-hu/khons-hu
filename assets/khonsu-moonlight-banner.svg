<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-labelledby="title desc">
  <title id="title">Patrick. Or khonsu.</title>
  <desc id="desc">A midnight-navy banner matching khns.dev: the khonsu crescent, the line "Patrick. Or khonsu." and a quiet mountain ridge under a moon.</desc>
  <defs>
    <linearGradient id="night" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#111B29"/>
      <stop offset="1" stop-color="#0B111A"/>
    </linearGradient>
    <linearGradient id="ridge" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#101A27"/>
      <stop offset="1" stop-color="#172638"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#A9C7E8" stop-opacity=".18"/>
      <stop offset="1" stop-color="#A9C7E8" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="300" rx="18" fill="url(#night)"/>
  <circle cx="985" cy="98" r="120" fill="url(#glow)"/>
  <circle cx="985" cy="98" r="46" fill="#C5D9EF" opacity=".9"/>
  <circle cx="972" cy="88" r="7" fill="#A9C7E8" opacity=".55"/>
  <circle cx="996" cy="112" r="4.5" fill="#A9C7E8" opacity=".5"/>
  <path d="M560 300 700 214l84 34 112-70 96 52 108-64 120 58v76Z" fill="url(#ridge)"/>
  <path d="M640 300 770 246l92 22 120-42 104 30 114-26v70Z" fill="#0D1520"/>
  <circle cx="842" cy="64" r="1.8" fill="#B6A4DE" opacity=".8"/>
  <circle cx="1112" cy="150" r="1.6" fill="#A9C7E8" opacity=".7"/>
  <circle cx="1080" cy="40" r="2" fill="#7FC9AC" opacity=".8"/>
  <g transform="translate(88 58) scale(.72)">
    <path d="M33 8a17 17 0 1 0 7 27A18 18 0 0 1 33 8Z" fill="#E8EDF2" transform="translate(-6 -6)"/>
  </g>
  <text x="122" y="80" fill="#E8EDF2" font-family="'Avenir Next', Avenir, 'Segoe UI', system-ui, sans-serif" font-size="20" font-weight="600">khonsu<tspan fill="#7FC9AC">.</tspan></text>
  <text x="88" y="168" fill="#E8EDF2" font-family="Georgia, 'Times New Roman', serif" font-size="58">Patrick.</text>
  <text x="88" y="232" fill="#E8EDF2" font-family="Georgia, 'Times New Roman', serif" font-size="58">Or <tspan fill="#A9C7E8" font-style="italic">khonsu.</tspan></text>
  <text x="440" y="226" fill="#98A7B7" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" letter-spacing="2">L2 SUPPORT · AGENT TOOLS</text>
</svg>
